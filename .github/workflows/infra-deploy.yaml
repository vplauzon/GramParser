name: Infra Deploy

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Image digest (sha256:...) for the first deployment; leave blank to preserve the current image'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: gram-parser-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Bicep
        run: az bicep build --file deployment/gram-parser-infra.bicep --stdout > /dev/null

      - name: Log into Azure with the infrastructure deployment identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.INFRA_TENANT_ID }}
          subscription-id: ${{ secrets.INFRA_SUBSCRIPTION_ID }}

      - name: Deploy Container App infrastructure
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          ACR_PULL_IDENTITY_NAME: ${{ vars.ACR_PULL_IDENTITY_NAME }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          for variable in ACR_NAME RESOURCE_GROUP CONTAINER_APP_NAME ACR_PULL_IDENTITY_NAME; do
            if [[ -z "${!variable}" ]]; then
              echo "Set the $variable variable in the dev GitHub environment before deploying." >&2
              exit 1
            fi
          done
          acr_resource_group=$(az acr show --name "$ACR_NAME" --query resourceGroup --output tsv)
          if [[ -z "$acr_resource_group" ]]; then
            echo "Could not resolve the resource group for registry '$ACR_NAME'." >&2
            exit 1
          fi
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          if [[ -z "$login_server" ]]; then
            echo "Could not resolve the registry login server." >&2
            exit 1
          fi
          if [[ -z "$IMAGE_DIGEST" ]]; then
            app_id=$(az resource list --resource-group "$RESOURCE_GROUP" \
              --resource-type Microsoft.App/containerApps --name "$CONTAINER_APP_NAME" \
              --query '[0].id' --output tsv)
            if [[ -z "$app_id" ]]; then
              echo "For the first deployment, supply image_digest from a published build." >&2
              exit 1
            fi
            current_image=$(az containerapp show --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "properties.template.containers[?name=='workbench'].image | [0]" --output tsv)
            image_prefix="$login_server/gram-parser-workbench@"
            if [[ "$current_image" != "$image_prefix"* ]]; then
              echo "The current image is not a pinned workbench image; supply image_digest explicitly." >&2
              exit 1
            fi
            IMAGE_DIGEST="${current_image#"$image_prefix"}"
          fi
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "image_digest must be a sha256 digest with 64 lowercase hexadecimal digits." >&2
            exit 1
          fi
          app_url=$(az deployment group create \
            --name "gram-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" \
            --mode Incremental \
            --template-file deployment/gram-parser-infra.bicep \
            --parameters acrName="$ACR_NAME" acrResourceGroupName="$acr_resource_group" \
              appName="$CONTAINER_APP_NAME" pullIdentityName="$ACR_PULL_IDENTITY_NAME" \
              imageName="gram-parser-workbench@$IMAGE_DIGEST" \
            --query properties.outputs.appUrl.value --output tsv)
          echo "Container App: $app_url"
          echo "Container App: $app_url" >> "$GITHUB_STEP_SUMMARY"
