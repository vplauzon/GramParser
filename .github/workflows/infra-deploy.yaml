name: Infra Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: gram-parser-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Bicep
        run: az bicep build --file deployment/gram-parser-infra.bicep --stdout > /dev/null

      - name: Log into Azure with the infrastructure deployment identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.INFRA_CLIENT_ID }}
          tenant-id: ${{ secrets.INFRA_TENANT_ID }}
          subscription-id: ${{ secrets.INFRA_SUBSCRIPTION_ID }}

      - name: Deploy Container App infrastructure
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          ACR_PULL_IDENTITY_NAME: ${{ vars.ACR_PULL_IDENTITY_NAME }}
        run: |
          for variable in ACR_NAME RESOURCE_GROUP CONTAINER_APP_NAME ACR_PULL_IDENTITY_NAME; do
            if [[ -z "${!variable}" ]]; then
              echo "Set the $variable variable in the dev GitHub environment before deploying." >&2
              exit 1
            fi
          done
          acr_resource_group=$(az acr show --name "$ACR_NAME" --query resourceGroup --output tsv)
          if [[ -z "$acr_resource_group" ]]; then
            echo "Could not resolve the resource group for registry '$ACR_NAME'." >&2
            exit 1
          fi
          acr_id=$(az acr show --name "$ACR_NAME" --query id --output tsv)
          acr_role_mode=$(az rest --method get --url "${acr_id}?api-version=2025-11-01" \
            --query properties.roleAssignmentMode --output tsv)
          case "$acr_role_mode" in
            AbacRepositoryPermissions)
              pull_role_id=b93aa761-3e63-49ed-ac28-beffa264f7ac
              ;;
            LegacyRegistryPermissions)
              pull_role_id=7f951dda-4ed3-4680-a7ca-43fe172d538d
              ;;
            *)
              echo "Unsupported or missing registry role assignment mode: '$acr_role_mode'." >&2
              exit 1
              ;;
          esac
          app_url=$(az deployment group create \
            --name "gram-parser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$RESOURCE_GROUP" \
            --mode Incremental \
            --template-file deployment/gram-parser-infra.bicep \
            --parameters acrName="$ACR_NAME" acrResourceGroupName="$acr_resource_group" \
              appName="$CONTAINER_APP_NAME" pullIdentityName="$ACR_PULL_IDENTITY_NAME" \
              pullRoleId="$pull_role_id" \
            --query properties.outputs.appUrl.value --output tsv)
          echo "Container App: $app_url"
          echo "Container App: $app_url" >> "$GITHUB_STEP_SUMMARY"
