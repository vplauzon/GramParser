name: Publish NuGet package

on:
  workflow_dispatch:
    inputs:
      alpha:
        type: boolean
        required: true
        default: true
        description: Publish an alpha prerelease

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ALPHA: ${{ inputs.alpha }}
      RUN_NUMBER: ${{ github.run_number }}
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Check out main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Calculate package version
        id: package-version
        shell: bash
        run: |
          base_version=$(dotnet msbuild code/GramParserLib/GramParserLib.csproj -getProperty:Version)
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable three-part SemVer in GramParserLib.csproj, got '$base_version'." >&2
            exit 1
          fi

          package_version="$base_version"
          if [[ "$ALPHA" == "true" ]]; then
            package_version="${base_version}-alpha.${RUN_NUMBER}"
          fi
          informational_version="${package_version}+${COMMIT_SHA:0:12}"

          echo "package=$package_version" >> "$GITHUB_OUTPUT"
          echo "informational=$informational_version" >> "$GITHUB_OUTPUT"
          echo "Publishing GramParser $package_version"

      - name: Restore
        run: dotnet restore code/GramParserLib/GramParserLib.csproj

      - name: Pack
        run: >-
          dotnet pack code/GramParserLib/GramParserLib.csproj
          --configuration Release
          --no-restore
          --output artifacts
          -p:Version='${{ steps.package-version.outputs.package }}'
          -p:PackageVersion='${{ steps.package-version.outputs.package }}'
          -p:InformationalVersion='${{ steps.package-version.outputs.informational }}'
          -p:IncludeSourceRevisionInInformationalVersion=false

      - name: Log in to NuGet using trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
